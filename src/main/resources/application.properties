# ===============================
# = DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.properties.hibernate.default_schema=biblioteca_schema
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# = SERVER
# ===============================
server.port=8080

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.biblioteca=DEBUG
logging.level.org.hibernate.SQL=${LOG_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_PARAMS:TRACE}

# ===============================
# = SCHEDULING
# ===============================
spring.task.scheduling.pool.size=1

# ===============================
# = SALUD (para Docker y monitorización)
# ===============================
management.endpoints.web.exposure.include=health
