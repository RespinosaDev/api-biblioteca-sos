name: CI

on: [push, pull_request]

jobs:
  tests:
    name: Tests (Maven + H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test

  docker:
    name: Docker (API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir y arrancar con docker compose
        run: docker compose up --build -d
      - name: Prueba de humo contra la API en Docker
        run: bash docker/prueba-humo.sh
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs
      - name: Parar
        if: always()
        run: docker compose down -v
